<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍕 Sign Up - FOODIE</title>

  <!-- BEAUTIFUL FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ========================================
       RESET & BASE STYLES
       ======================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      overflow: hidden;
      background: #0a0a0a;
    }

    /* ========================================
       FLASH MESSAGES STYLES
       ======================================== */
    .flash-messages-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      width: 90%;
      max-width: 500px;
    }

    @keyframes slideInDown {
      from {
        transform: translateX(-50%) translateY(-100px);
        opacity: 0;
      }

      to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      to {
        opacity: 0;
        transform: translateX(-50%) translateY(-100px);
      }
    }

    .flash-message.hiding {
      animation: fadeOut 0.5s ease forwards;
    }

    /* ========================================
       MAIN CONTAINER
       Split screen: Left (images) + Right (form)
       ======================================== */
    .container {
      display: flex;
      height: 100vh;
      position: relative;
    }

    /* ========================================
       LEFT SIDE - ANIMATED FOOD IMAGES 🍕
       ======================================== */
    .left-section {
      flex: 1;
      background: linear-gradient(135deg, #FF6B35 0%, #F7931E 50%, #FF6B35 100%);
      background-size: 200% 200%;
      animation: gradientShift 15s ease infinite;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Gradient animation - makes background move! */
    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* Floating particles in background ✨ */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: float 20s infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        transform: translateY(-100vh) translateX(100px);
        opacity: 0;
      }
    }

    /* Food images container */
    .image-slider {
      position: relative;
      width: 85%;
      height: 85%;
      z-index: 10;
    }

    /* Each food image */
    .food-image {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transform: scale(0.8) rotate(-10deg);
      transition: all 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      border-radius: 30px;
      filter: drop-shadow(0 30px 80px rgba(0, 0, 0, 0.5));
    }

    /* Active image - shows up with bounce effect! */
    .food-image.active {
      opacity: 1;
      transform: scale(1) rotate(0deg);
      animation: imageBounce 1s ease;
    }

    @keyframes imageBounce {
      0% {
        transform: scale(0.5) rotate(-20deg);
        opacity: 0;
      }

      60% {
        transform: scale(1.1) rotate(5deg);
      }

      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    /* Text on left side */
    .left-content {
      position: absolute;
      bottom: 80px;
      left: 80px;
      color: white;
      z-index: 20;
      animation: slideUp 1s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(50px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .left-content h1 {
      font-size: 56px;
      font-weight: 800;
      margin-bottom: 16px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      letter-spacing: -1px;
    }

    .left-content p {
      font-size: 22px;
      font-weight: 500;
      opacity: 0.95;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    /* Stats badges - show some cool numbers! */
    .stats-badges {
      position: absolute;
      top: 60px;
      right: 60px;
      display: flex;
      gap: 20px;
      animation: slideDown 1s ease 0.3s backwards;
    }

    @keyframes slideDown {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .stat-badge {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      padding: 16px 24px;
      border-radius: 16px;
      text-align: center;
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
      transition: all 0.3s ease;
    }

    .stat-badge:hover {
      transform: translateY(-5px) scale(1.05);
      background: rgba(255, 255, 255, 0.3);
    }

    .stat-badge .number {
      font-size: 28px;
      font-weight: 800;
      display: block;
    }

    .stat-badge .label {
      font-size: 12px;
      opacity: 0.9;
      font-weight: 600;
    }

    /* ========================================
       RIGHT SIDE - SIGN UP FORM 📝
       ======================================== */


    .right-section {
      flex: 1;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* Form container */
    .form-container {
      width: 100%;
      max-width: 480px;
      animation: slideInRight 1s ease;
    }

    @keyframes slideInRight {
      from {
        transform: translateX(50px);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* Logo at top */
    .logo {
      font-size: 42px;
      font-weight: 800;
      background: linear-gradient(135deg, #FF6B35, #F7931E);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 48px;
      letter-spacing: -1px;
      animation: logoGlow 2s ease infinite;
    }

    @keyframes logoGlow {

      0%,
      100% {
        filter: drop-shadow(0 0 10px rgba(255, 107, 53, 0.3));
      }

      50% {
        filter: drop-shadow(0 0 20px rgba(255, 107, 53, 0.5));
      }
    }

    /* Form header text */
    .form-header h2 {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #1a1a1a;
      letter-spacing: -0.5px;
    }

    .form-header p {
      font-size: 16px;
      color: #666;
      margin-bottom: 40px;
      font-weight: 500;
    }

    /* Form groups - each input field */
    .form-group {
      margin-bottom: 24px;
      animation: fadeInUp 0.6s ease backwards;
    }

    /* Stagger animation for each form field */
    .form-group:nth-child(1) {
      animation-delay: 0.1s;
    }

    .form-group:nth-child(2) {
      animation-delay: 0.2s;
    }

    .form-group:nth-child(3) {
      animation-delay: 0.3s;
    }

    .form-group:nth-child(4) {
      animation-delay: 0.4s;
    }

    .form-group:nth-child(5) {
      animation-delay: 0.5s;
    }

    @keyframes fadeInUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Two fields side by side */
    .form-row {
      display: flex;
      gap: 16px;
    }

    .form-row .form-group {
      flex: 1;
    }

    /* Input labels */
    label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      display: block;
      color: #333;
      letter-spacing: 0.2px;
    }

    /* Input wrapper - holds icon + input */
    .input-wrapper {
      position: relative;
    }

    /* Icon inside input */
    .input-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      z-index: 10;
      transition: all 0.3s ease;
    }

    /* When input is focused, icon bounces! */
    .input-wrapper.focused .input-icon {
      animation: iconBounce 0.5s ease;
    }

    @keyframes iconBounce {

      0%,
      100% {
        transform: translateY(-50%) scale(1);
      }

      50% {
        transform: translateY(-50%) scale(1.2);
      }
    }

    /* Input fields */
    input,
    select {
      width: 100%;
      padding: 16px 16px 16px 54px;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.3s ease;
      background: #f9fafb;
      color: #1a1a1a;
    }

    /* When you click on input - GLOW effect! */
    input:focus,
    select:focus {
      outline: none;
      border-color: #FF6B35;
      background: white;
      box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1),
        0 10px 30px rgba(255, 107, 53, 0.15);
      transform: translateY(-2px);
    }

    /* Error messages */
    .error-message {
      font-size: 13px;
      color: #ef4444;
      margin-top: 6px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      animation: shake 0.4s ease;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-10px);
      }

      75% {
        transform: translateX(10px);
      }
    }

    /* Password toggle button */
    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 22px;
      z-index: 10;
      transition: all 0.3s ease;
    }

    .password-toggle:hover {
      transform: translateY(-50%) scale(1.2);
    }

    /* Submit button - THE WOW BUTTON! */
    .btn-primary {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
      box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
      letter-spacing: 0.5px;
      margin-top: 8px;
    }

    /* Button shine effect */
    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: all 0.6s ease;
    }

    .btn-primary:hover::before {
      left: 100%;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(255, 107, 53, 0.4);
    }

    .btn-primary:active {
      transform: translateY(-1px);
    }

    /* Divider line */
    .divider {
      display: flex;
      align-items: center;
      margin: 32px 0;
      color: #999;
      font-size: 14px;
      font-weight: 500;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 2px;
      background: linear-gradient(to right, transparent, #e5e7eb, transparent);
    }

    .divider span {
      padding: 0 20px;
    }

    /* Social login buttons */
    .social-login {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
    }

    .social-btn {
      flex: 1;
      padding: 16px;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      background: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .social-btn:hover {
      transform: translateY(-3px);
      border-color: #FF6B35;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    /* Login link at bottom */
    .login-link {
      text-align: center;
      font-size: 15px;
      color: #666;
      font-weight: 500;
    }

    .login-link a {
      color: #FF6B35;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .login-link a:hover {
      text-decoration: underline;
      color: #F7931E;
    }

    /* Success message popup */
    .success-popup {
      position: fixed;
      top: 20px;
      right: 20px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      padding: 20px 30px;
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(16, 185, 129, 0.4);
      display: none;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      z-index: 1000;
      animation: slideInDown 0.5s ease;
    }

    /* Mobile responsive */
    @media (max-width: 968px) {
      .left-section {
        display: none;
      }

      .right-section {
        flex: 1;
      }

      .form-container {
        max-width: 100%;
      }
    }

    /* Loading spinner */
    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .btn-primary.loading .spinner {
      display: inline-block;
      margin-left: 10px;
    }
  </style>
</head>

<body>
<!-- Flash Messages Container -->
<div class="flash-messages-container" id="flashMessagesContainer" 
     style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10000; width: 90%; max-width: 500px;">
</div>

  <div class="container">
    <!-- ==========================================
         LEFT SIDE - BEAUTIFUL ANIMATED IMAGES 🎨
         ========================================== -->
    <div class="left-section">
      <!-- Floating particles for extra effect ✨ -->
      <div class="particles" id="particles"></div>

      <!-- Stats badges at top -->
      <div class="stats-badges">
        <div class="stat-badge">
          <span class="number">500+</span>
          <span class="label">Restaurants</span>
        </div>
        <div class="stat-badge">
          <span class="number">50K+</span>
          <span class="label">Happy Users</span>
        </div>
      </div>

      <!-- Rotating food images -->
      <div class="image-slider">
        <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=800" class="food-image active"
          alt="Pizza">
        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=800" class="food-image" alt="Burger">
        <img src="https://images.unsplash.com/photo-1579584425555-c3ce17fd4351?w=800" class="food-image" alt="Sushi">
        <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=800" class="food-image" alt="Pasta">
      </div>

      <!-- Text content -->
      <div class="left-content">
        <h1>🍕 Welcome to FOODIE</h1>
        <p>Your favorite meals, delivered hot & fresh in 30 minutes</p>
      </div>
    </div>

    <!-- ==========================================
         RIGHT SIDE - SIGN UP FORM 📝
         ========================================== -->
    <div class="right-section">
      <div class="form-container">
        <!-- Logo -->
        <div class="logo">🍕 FOODIE</div>

        <!-- Header -->
        <div class="form-header">
          <h2>Create your account</h2>
          <p>Start ordering delicious food in minutes ⚡</p>
        </div>

        <!-- MAIN FORM - This sends data to /register -->
        <form action="/register" method="POST" id="signupForm">
          <!-- Username field -->
          <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrapper">
              <span class="input-icon">👤</span>
              <input type="text" id="username" name="username" placeholder="Choose a cool username" required
                minlength="3">
            </div>
          </div>
          <!-- MAIN FORM - This sends data to /register -->
          <form action="/register" method="POST" id="signupForm">
            <!-- ADD THE CSRF TOKEN RIGHT HERE -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <!-- Username field -->
            <div class="form-group">
              <label for="username">Username</label>
              <div class="input-wrapper">
                <span class="input-icon">👤</span>
                <input type="text" id="username" name="username" placeholder="Choose a cool username" required
                  minlength="3">
              </div>
            </div>
            <!-- Email field -->
            <div class="form-group">
              <label for="email">Email Address</label>
              <div class="input-wrapper">
                <span class="input-icon">📧</span>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
              </div>
            </div>

            <!-- Password field -->
            <div class="form-group">
              <label for="password">Password</label>
              <div class="input-wrapper">
                <span class="input-icon">🔒</span>
                <input type="password" id="password" name="password" placeholder="At least 6 characters" required
                  minlength="6">
                <span class="password-toggle" onclick="togglePassword('password')">👁️</span>
              </div>
            </div>

            <!-- Confirm Password field -->
            <div class="form-group">
              <label for="confirm_password">Confirm Password</label>
              <div class="input-wrapper">
                <span class="input-icon">🔒</span>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Type password again"
                  required minlength="6">
                <span class="password-toggle" onclick="togglePassword('confirm_password')">👁️</span>
              </div>
            </div>

            <!-- Submit button -->
            <button type="submit" class="btn-primary" id="submitBtn">
              <span id="btnText">Create Account 🚀</span>
              <span class="spinner"></span>
            </button>
          </form>

          <!-- Divider -->
          <div class="divider">
            <span>or continue with</span>
          </div>

          <!-- Social login buttons -->
          <div class="social-login">
            <button class="social-btn" onclick="alert('Google login coming soon! 🔍')">
              🔍 Google
            </button>
            <button class="social-btn" onclick="alert('Facebook login coming soon! 📘')">
              📘 Facebook
            </button>
          </div>

          <!-- Login link -->
          <div class="login-link">
            Already have an account? <a href="/login">Sign in here</a>
          </div>
      </div>
    </div>
  </div>

  <!-- Success popup (shows when form is valid) -->
  <div class="success-popup" id="successPopup">
    <span style="font-size: 24px;">✅</span>
    <span>Account created successfully!</span>
  </div>

  <script>
    // ==========================================
    // EXPLANATION: This JavaScript makes everything interactive! 🎮
    // ==========================================

    // Auto-hide flash messages after 5 seconds
document.addEventListener('DOMContentLoaded', function() {
    const flashMessages = document.querySelectorAll('.flash-message');
    
    flashMessages.forEach(message => {
        setTimeout(() => {
            message.style.animation = 'fadeOut 0.5s ease forwards';
            setTimeout(() => {
                if (message.parentElement) {
                    message.remove();
                }
            }, 500);
        }, 5000);
    });
});

    // 1️⃣ CREATE FLOATING PARTICLES (those dots in background)
    // This adds 20 particles that float up randomly
    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 20; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';

        // Random position and delay
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 20 + 's';
        particle.style.animationDuration = (15 + Math.random() * 10) + 's';

        container.appendChild(particle);
      }
    }
    createParticles();

    // 2️⃣ ROTATE FOOD IMAGES (changes every 3 seconds)
    // This makes the food images slide in one by one
    const images = document.querySelectorAll('.food-image');
    let currentIndex = 0;

    function rotateImages() {
      // Remove 'active' class from current image
      images[currentIndex].classList.remove('active');

      // Move to next image (or back to first)
      currentIndex = (currentIndex + 1) % images.length;

      // Add 'active' class to new image
      images[currentIndex].classList.add('active');
    }

    // Change image every 3 seconds (3000 milliseconds)
    setInterval(rotateImages, 3000);

    // 3️⃣ INPUT FOCUS ANIMATION
    // When you click on an input, the icon bounces!
    const inputs = document.querySelectorAll('input, select');

    inputs.forEach(input => {
      input.addEventListener('focus', function () {
        this.parentElement.classList.add('focused');
      });

      input.addEventListener('blur', function () {
        this.parentElement.classList.remove('focused');
      });
    });

    // 4️⃣ TOGGLE PASSWORD VISIBILITY
    // Click the eye icon to show/hide password
    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      const toggle = field.nextElementSibling;

      if (field.type === 'password') {
        field.type = 'text';
        toggle.textContent = '👁️‍🗨️'; // Open eye
      } else {
        field.type = 'password';
        toggle.textContent = '👁️'; // Closed eye
      }
    }

    // 5️⃣ FORM VALIDATION & SUBMISSION
    // This checks if everything is correct before sending
    const form = document.getElementById('signupForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    form.addEventListener('submit', function (e) {
      // Clear all previous errors
      clearAllErrors();

      let isValid = true;

      // Get all field values
      const username = document.getElementById('username');
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const confirmPassword = document.getElementById('confirm_password');

      // CHECK 1: Username (must be at least 3 characters)
      if (username.value.trim().length < 3) {
        showError(username, '⚠️ Username must be at least 3 characters');
        isValid = false;
      }

      // CHECK 2: Email (must have @ and .)
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email.value)) {
        showError(email, '⚠️ Please enter a valid email address');
        isValid = false;
      }

      // CHECK 3: Password (must be at least 6 characters)
      if (password.value.length < 6) {
        showError(password, '⚠️ Password must be at least 6 characters');
        isValid = false;
      }

      // CHECK 4: Passwords must match
      if (password.value !== confirmPassword.value) {
        showError(confirmPassword, '⚠️ Passwords do not match');
        isValid = false;
      }

      // If something is wrong, DON'T submit the form
      if (!isValid) {
        e.preventDefault();
        return;
      }

      // Everything is good! Show loading animation
      submitBtn.classList.add('loading');
      btnText.textContent = 'Creating Account...';

      // Show success popup after a moment
      setTimeout(() => {
        const popup = document.getElementById('successPopup');
        popup.style.display = 'flex';

        // Hide popup after 3 seconds
        setTimeout(() => {
          popup.style.display = 'none';
        }, 3000);
      }, 500);
    });

    // 6️⃣ SHOW ERROR MESSAGE
    // This creates a red error message under the input
    function showError(input, message) {
      // Check if error message already exists
      let error = input.parentElement.parentElement.querySelector('.error-message');

      if (!error) {
        // Create new error element
        error = document.createElement('div');
        error.className = 'error-message';
        input.parentElement.parentElement.appendChild(error);
      }

      error.innerHTML = `<span>⚠️</span> ${message}`;

      // Make input border red
      input.style.borderColor = '#ef4444';
    }

    // 7️⃣ CLEAR ALL ERRORS
    // Remove all error messages
    function clearAllErrors() {
      const errors = document.querySelectorAll('.error-message');
      errors.forEach(error => error.remove());

      // Reset input borders
      inputs.forEach(input => {
        input.style.borderColor = '#e5e7eb';
      });
    }

    // 8️⃣ REAL-TIME PASSWORD STRENGTH CHECKER
    // Shows password strength as you type
    const passwordField = document.getElementById('password');

    passwordField.addEventListener('input', function () {
      const password = this.value;
      let strength = 0;

      // Check length
      if (password.length >= 6) strength++;
      if (password.length >= 10) strength++;

      // Check for uppercase
      if (/[A-Z]/.test(password)) strength++;

      // Check for numbers
      if (/[0-9]/.test(password)) strength++;

      // Check for special characters
      if (/[^A-Za-z0-9]/.test(password)) strength++;

      // Change border color based on strength
      if (strength <= 2) {
        this.style.borderColor = '#ef4444'; // Red - weak
      } else if (strength <= 3) {
        this.style.borderColor = '#f59e0b'; // Orange - medium
      } else {
        this.style.borderColor = '#10b981'; // Green - strong
      }
    });

    // 9️⃣ SHOW MESSAGE IF PAGE LOADS WITH ERRORS
    // Flask sends error messages, we display them nicely
    window.addEventListener('load', function () {
      // Check if there are any Flask flash messages
      const flashMessages = document.querySelectorAll('.alert');

      flashMessages.forEach(msg => {
        // Style them beautifully
        msg.style.animation = 'shake 0.5s ease';

        // Auto-hide after 5 seconds
        setTimeout(() => {
          msg.style.animation = 'fadeOut 0.5s ease';
          setTimeout(() => {
            msg.remove();
          }, 500);
        }, 5000);
      });
    });
  </script>
</body>
